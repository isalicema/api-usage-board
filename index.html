<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-AI Usage Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151a23'/%3E%3Crect x='13' y='30' width='10' height='21' rx='3' fill='%2322c55e'/%3E%3Crect x='27' y='17' width='10' height='34' rx='3' fill='%23eab308'/%3E%3Crect x='41' y='24' width='10' height='27' rx='3' fill='%23fb7185'/%3E%3C/svg%3E">
<script>
// 首帧前定下主题，避免闪烁：localStorage 优先，缺省跟随系统
(function () {
  var t = localStorage.getItem('aub:theme')
    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="usage-board.css">
</head>
<body>
<div class="page">

  <!-- 顶部导航 -->
  <nav class="topnav">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="token">Token 用量</button>
  </nav>
  <div class="title-row">
    <h1>Multi-AI Usage Monitor</h1>
    <div class="title-right">
      <span class="mock-pill" id="mock-pill" hidden>MOCK 数据</span>
      <div class="local-time" id="local-time"></div>
      <button class="theme-toggle" id="theme-toggle" title="切换深色/浅色" aria-label="切换深色/浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ============ Tab 1: Dashboard ============ -->
  <section id="tab-dashboard">
    <div id="alert-banner"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>配额</h2>
        <div class="quota-chips" id="quota-chips"></div>
      </div>
      <div class="quota-legend">▎竖线 = 窗口时间进度；用量超过竖线 = 消耗快于时间节奏</div>
      <div id="quota-blocks"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>API 状态</h2></div>
      <div id="api-status-rows"></div>
    </div>
  </section>

  <!-- ============ Tab 2: Token 用量 ============ -->
  <section id="tab-token" hidden>
    <div class="sync-row" id="sync-row"></div>

    <div class="panel">
      <div class="panel-head"><h2>今日概览</h2><span class="panel-sub" id="today-date"></span></div>
      <div class="overview-cards">
        <div class="ov-card">
          <div class="ov-num" id="ov-total">—</div>
          <div class="ov-label">今日总处理 Token</div>
          <div class="ov-sub" id="ov-total-breakdown"></div>
          <div class="ov-sub dim" id="ov-total-ref"></div>
        </div>
        <div class="ov-card">
          <div class="ov-num" id="ov-auth">—</div>
          <div class="ov-label">今日权威 Token</div>
          <div class="ov-sub" id="ov-auth-breakdown"></div>
          <div class="ov-sub dim">不含 cache</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>每日用量</h2><span class="panel-sub">含 cache · 最近一年 · hover 看明细 · 虚线 = 未来周</span></div>
      <div class="hm-wrap"><div class="hm" id="heatmap"></div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>趋势与分布</h2>
        <div class="trend-controls">
          <div class="range-pills" id="range-pills">
            <button data-range="today">今日</button>
            <button data-range="yesterday">昨日</button>
            <button data-range="3">近3日</button>
            <button data-range="7">近7日</button>
            <button data-range="30" class="active">近30日</button>
          </div>
          <select id="metric-select">
            <option value="total">口径：总处理量（含 cache）</option>
            <option value="auth">口径：权威量（不含 cache）</option>
          </select>
        </div>
      </div>
      <div class="chart-legend" id="chart-legend"></div>
      <div class="chart-wrap"><canvas id="trend-canvas"></canvas></div>
      <div class="chart-summary" id="chart-summary"></div>
    </div>

    <div class="panel-duo">
      <div class="panel">
        <div class="panel-head"><h2>Coding Agent</h2></div>
        <div id="agent-bars"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>模型</h2></div>
        <div id="model-bars"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>项目</h2>
        <span class="panel-sub">按工作目录聚合 · OpenRouter 服务端无项目维度，未计入</span>
      </div>
      <div id="project-bars"></div>
    </div>

    <div class="panel" id="cost-panel" hidden>
      <div class="panel-head">
        <h2>费用预估与套餐回报</h2>
        <span class="panel-sub" id="cost-summary-line"></span>
      </div>
      <div id="cost-rows"></div>
      <div class="cost-note" id="cost-note">按官方刊例价估算 · 价格表与套餐金额见 server/config.json</div>
    </div>
  </section>

</div>
<div id="aub-tooltip" class="aub-tip" hidden></div>
<script type="module" src="usage-board.js"></script>
</body>
</html>
